# ╔═══════════════════════════════════════════════════════════════╗
# ║  WhatsApp Commerce OS — Dedicated Cell / Pod Topology         ║
# ║  Per-Tenant / VIP-Pod Complete Blast-Radius Isolation         ║
# ║                                                               ║
# ║  Usage:                                                       ║
# ║    docker compose --env-file .env.cell.example \              ║
# ║      -p cell-tenant-01 -f docker-compose.cell.yml up -d       ║
# ╚═══════════════════════════════════════════════════════════════╝

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CELL_DB_USER:-wcos_cell}
      POSTGRES_PASSWORD: ${CELL_DB_PASSWORD:?CELL_DB_PASSWORD is required}
      POSTGRES_DB: ${CELL_DB_NAME:-wcos_cell}
    volumes:
      - cell_postgres_data:/var/lib/postgresql/data
    networks:
      - cell-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CELL_DB_USER:-wcos_cell} -d ${CELL_DB_NAME:-wcos_cell}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${CELL_REDIS_QUEUE_PASSWORD:?CELL_REDIS_QUEUE_PASSWORD is required}
    volumes:
      - cell_redis_queue_data:/data
    networks:
      - cell-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CELL_REDIS_QUEUE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${CELL_REDIS_CACHE_PASSWORD:?CELL_REDIS_CACHE_PASSWORD is required}
    volumes:
      - cell_redis_cache_data:/data
    networks:
      - cell-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CELL_REDIS_CACHE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://evolution-api:8080}
      SERVER_TYPE: http
      SERVER_PORT: 8080
      LOG_LEVEL: WARN
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_GLOBAL_KEY:?EVOLUTION_API_GLOBAL_KEY is required}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${CELL_DB_USER:-wcos_cell}:${CELL_DB_PASSWORD}@postgres:5432/${CELL_DB_NAME:-wcos_cell}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_${CELL_ID:-default}
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${CELL_REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      CACHE_REDIS_PREFIX_KEY: evo_${CELL_ID:-default}
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: http://api:3002/webhooks/evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
    volumes:
      - cell_evolution_data:/evolution/instances
    networks:
      - cell-internal
      - cell-edge
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${CELL_ENV_FILE:-.env.cell.example}
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${CELL_DB_USER:-wcos_cell}:${CELL_DB_PASSWORD}@postgres:5432/${CELL_DB_NAME:-wcos_cell}
      REDIS_QUEUE_URL: redis://:${CELL_REDIS_QUEUE_PASSWORD}@redis-queue:6379/0
      REDIS_CACHE_URL: redis://:${CELL_REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      REDIS_URL: redis://:${CELL_REDIS_QUEUE_PASSWORD}@redis-queue:6379/0
      EVOLUTION_API_URL: http://evolution-api:8080
    networks:
      - cell-internal
      - cell-edge
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    deploy:
      replicas: ${CELL_WORKER_REPLICAS:-2}
    env_file:
      - ${CELL_ENV_FILE:-.env.cell.example}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${CELL_DB_USER:-wcos_cell}:${CELL_DB_PASSWORD}@postgres:5432/${CELL_DB_NAME:-wcos_cell}
      REDIS_QUEUE_URL: redis://:${CELL_REDIS_QUEUE_PASSWORD}@redis-queue:6379/0
      REDIS_CACHE_URL: redis://:${CELL_REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      REDIS_URL: redis://:${CELL_REDIS_QUEUE_PASSWORD}@redis-queue:6379/0
      EVOLUTION_API_URL: http://evolution-api:8080
    networks:
      - cell-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    env_file:
      - ${CELL_ENV_FILE:-.env.cell.example}
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${CELL_DB_USER:-wcos_cell}:${CELL_DB_PASSWORD}@postgres:5432/${CELL_DB_NAME:-wcos_cell}
      API_URL: http://api:3002
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_STOREFRONT_URL: ${PUBLIC_STOREFRONT_URL}
      STOREFRONT_URL: ${PUBLIC_STOREFRONT_URL}
    networks:
      - cell-internal
      - cell-edge
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    restart: unless-stopped
    env_file:
      - ${CELL_ENV_FILE:-.env.cell.example}
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${CELL_DB_USER:-wcos_cell}:${CELL_DB_PASSWORD}@postgres:5432/${CELL_DB_NAME:-wcos_cell}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_ROOT_DOMAIN: ${STOREFRONT_ROOT_DOMAIN}
    networks:
      - cell-internal
      - cell-edge
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  cell_postgres_data:
  cell_redis_queue_data:
  cell_redis_cache_data:
  cell_evolution_data:

networks:
  cell-internal:
    internal: true
  cell-edge:
    driver: bridge

